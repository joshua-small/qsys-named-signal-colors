name: Mod catalog
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Published stable release tag'
        type: string
        required: true
      content_ref:
        description: 'Content ref (blank uses release tag)'
        type: string
        default: ''
permissions:
  contents: write
jobs:
  catalog:
    uses: joshua-small/qsys-mod-manager/.github/workflows/publish-mod-catalog.yml@b9e542dd0a2c87501ae97c04e0d7efcf1e0d2b7a
    with:
      tool_revision: b9e542dd0a2c87501ae97c04e0d7efcf1e0d2b7a
      tag: ${{ github.event.release.tag_name || inputs.tag || '' }}
      content_ref: ${{ inputs.content_ref || '' }}
      publish: true
